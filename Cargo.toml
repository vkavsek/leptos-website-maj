[package]
name = "leptos-website-maj"
version = "2.0.0"
edition = "2021"
rust-version = "1.94"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
#Tokio
tokio = { version = "1", optional = true, features = ["full"] }

# Axum
axum = { version = "0.8", features = ["multipart"], optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
tower-http = { version = "0.7", features = [
  "fs",
  "trace",
  "request-id",
  "compression-br",
  "compression-gzip",
], optional = true }

# Tracing & Logging
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
console_error_panic_hook = { version = "0.1", optional = true }

#Leptos
leptos = { version = "0.8", features = ["tracing"] }
leptos_meta = { version = "0.8" }
leptos_router = { version = "0.8" }
leptos-use-event-listener = "0.20"
leptos_axum = { version = "0.8", optional = true }
wasm-bindgen = { version = "=0.2", optional = true }

# Http & Web-SYS
http = "1"
web-sys = { version = "0.3", features = ["DomRect"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Others
thiserror = "2"
jiff = "1"
lettre = { version = "0.11", features = [
  "tokio1",
  "tokio1-native-tls",
], optional = true }
strum = "0.28"
strum_macros = "0.28"
parking_lot = { version = "0.13", optional = true }
secrecy = { version = "0.10", optional = true }
libc = { version = "0.2", optional = true }
sqlx = { version = "0.9", default-features = false, features = [
  "sqlite",
  "runtime-tokio",
  "migrate",
  "macros",
], optional = true }
tower-sessions-sqlx-store = { version = "0.16", default-features = false, features = [
  "sqlite",
], optional = true }
tower-sessions = { version = "0.15", default-features = false, features = [
  "axum-core",
], optional = true }
oauth2 = { version = "5", default-features = false, optional = true }
openidconnect = { version = "4.1", default-features = false, optional = true }
jsonwebtoken = { version = "12", default-features = false, features = [
  "aws_lc_rs",
  "use_pem",
], optional = true }
reqwest = { version = "0.13", default-features = false, features = [
  "rustls",
], optional = true }
http-cache-semantics = { version = "3", default-features = false, features = [
  "reqwest",
], optional = true }
sha2 = { version = "0.11", optional = true }
subtle = { version = "2", optional = true }
tempfile = { version = "3", optional = true }
url = { version = "2", optional = true }
percent-encoding = { version = "2", optional = true }
image = { version = "0.25", default-features = false, features = [
  "jpeg",
  "png",
  "webp",
], optional = true }
clap = { version = "4", features = ["derive"], optional = true }

[features]
# Browser current-time reads need Jiff's JavaScript clock instead of std::SystemTime.
hydrate = ["leptos/hydrate", "dep:console_error_panic_hook", "dep:wasm-bindgen", "jiff/js"]
ssr = [
  "leptos/ssr",
  "leptos_meta/ssr",
  "leptos_router/ssr",
  "leptos-use-event-listener/ssr",
  "dep:axum",
  "dep:tokio",
  "dep:tower",
  "dep:tower-http",
  "dep:leptos_axum",
  "dep:lettre",
  "dep:parking_lot",
  "dep:secrecy",
  "dep:libc",
  "dep:sqlx",
  "dep:tower-sessions-sqlx-store",
  "dep:tower-sessions",
  "dep:oauth2",
  "dep:openidconnect",
  "dep:jsonwebtoken",
  "dep:reqwest",
  "dep:http-cache-semantics",
  "dep:sha2",
  "dep:subtle",
  "dep:tempfile",
  "dep:url",
  "dep:percent-encoding",
  "dep:image",
  "dep:clap",
]

[patch.crates-io]
# Upstream SQLx #4502 permits patched libsqlite3-sys 0.39.x; stable 0.9.0 does not.
# Pin the first compatible upstream fix for both application and session-store SQLx.
# Remove after a stable release includes it; review by 2026-12-17. See README.md.
sqlx = { git = "https://github.com/launchbadge/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }

# Defines a size-optimized profile for the WASM bundle in release mode
[profile.wasm-release]
inherits = "release"
opt-level = 'z'
lto = true
codegen-units = 1
panic = "abort"

[package.metadata.leptos]
# The name used by wasm-bindgen/cargo-leptos for the JS/WASM bundle. Defaults to the crate name
output-name = "leptos-website-maj"

# The site root folder is where cargo-leptos generate all output.
# WARNING: all content of this folder will be erased on a rebuild. Use it in your server setup.
site-root = "target/site"

# The site-root relative folder where all compiled output (JS, WASM and CSS) is written
# Defaults to pkg
site-pkg-dir = "pkg"

# [Optional] The source CSS file. If it ends with .sass or .scss then it will be compiled by dart-sass into CSS. The CSS is optimized by Lightning CSS before being written to <site-root>/<site-pkg>/app.css
style-file = "style/main.scss"

# Assets source dir. All files found here will be copied and synchronized to site-root.
# The assets-dir cannot have a sub directory with the same name/path as site-pkg-dir.
#
# Optional. Env: LEPTOS_ASSETS_DIR.
assets-dir = "public"

# The IP and port (ex: 127.0.0.1:3000) where the server serves the content. Use it in your server setup.
site-addr = "0.0.0.0:8080"

# The port to use for automatic reload monitoring
reload-port = 8081

# [Optional] Command to use when running end2end tests. It will run in the end2end dir.
#   [Windows] for non-WSL use "npx.cmd playwright test"
#   This binary name can be checked in Powershell with Get-Command npx
end2end-cmd = "npx playwright test"
end2end-dir = "end2end"

#  The browserlist query used for optimizing the CSS.
browserquery = "defaults"

# The environment Leptos will run in, usually either "DEV" or "PROD"
env = "PROD"

# The features to use when compiling the bin target
#
# Optional. Can be over-ridden with the command line parameter --bin-features
bin-features = ["ssr"]

# If the --no-default-features flag should be used when compiling the bin target
#
# Optional. Defaults to false.
bin-default-features = false

# The features to use when compiling the lib target
#
# Optional. Can be over-ridden with the command line parameter --lib-features
lib-features = ["hydrate"]

# If the --no-default-features flag should be used when compiling the lib target
#
# Optional. Defaults to false.
lib-default-features = false

# The profile to use for the lib target when compiling for release
#
# Optional. Defaults to "release".
lib-profile-release = "wasm-release"
