[graph]
# Inspect server and browser dependencies without compiling incompatible feature sets together.
all-features = true

[advisories]
yanked = "deny"
unmaintained = "all"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
